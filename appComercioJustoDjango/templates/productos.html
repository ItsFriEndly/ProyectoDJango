<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Codificacion de caracteres utilizada -->
    <meta charset="utf-8">
    <!-- Título de la página que aparecerá en la pestaña -->
    <title>Comercio Justo - Productos</title>
    <!-- Descripción de la página -->
    <meta name="description" content="Productos habituales de comercio justo, su origen y su precio.">
    <!-- Hoja de estilos CSS utilizada -->
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>

    <!-- Cabecera con el logotipo y el menú de navegación -->
    <header>
        <img src="/static/img/logo_comercioJusto.png" alt="Logo de Comercio Justo" width="120" height="120">
        <h1>Comercio Justo</h1>
        <nav>
            <ul>
                <li><a href="/appComercioJustoDjango/">Inicio</a></li>
                <li><a href="/appComercioJustoDjango/principios/">Principios</a></li>
                <li><a href="/appComercioJustoDjango/productos/">Productos</a></li>
                <li><a href="/appComercioJustoDjango/contacto/">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido principal de la página -->
    <main>
        <section>
            <h2>Productos de comercio justo</h2>
            <p>Estos son algunos de los productos más habituales:</p>
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Origen</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Café</td>
                        <td>Colombia</td>
                        <td>4.50 €</td>
                    </tr>
                    <tr>
                        <td>Cacao</td>
                        <td>Ghana</td>
                        <td>3.20 €</td>
                    </tr>
                    <tr>
                        <td>Té</td>
                        <td>India</td>
                        <td>2.80 €</td>
                    </tr>
                    <tr>
                        <td>Azúcar de caña</td>
                        <td>Paraguay</td>
                        <td>2.10 €</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>Copyright 2026 Comercio Justo</p>
    </footer>

</body>
</html>
