{% extends "base.html" %}

{% block title %}Comercio Justo - Categorías{% endblock %}

{% block content %}
    <section>
        <h2>Categorías</h2>
        <table>
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody>
                {% for categoria in categorias %}
                <tr>
                    <td><a href="{% url 'categoria_detalle' categoria.id %}">{{ categoria.nombre }}</a></td>
                    <td>{{ categoria.descripcion }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2">No hay categorías disponibles.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>
{% endblock %}
